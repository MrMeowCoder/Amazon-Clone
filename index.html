<!DOCTYPE html>
<html>
    <head>
        <title>Amazon</title>
        <link rel="stylesheet" href="./style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <header>
            <!--Navigation bar-->
            <nav>
                <!--Upper Navigation bar-->
                <div class="topnav">
                    <!--Amazon Logo-->
                    <div class="nav-logo border">
                        <div id="logo"></div>
                    </div>

                    <!--Delivary Country-->
                    <div class="deliver-to border">
                        <p id="delv-to">Deliver to</p>
                        <div class="deliver-to-country">
                            <i class="fa-solid fa-location-dot"></i>
                            <p id="country">India</p>
                        </div>
                    </div>

                    <!--Search Category-->
                    <div class="nav-search-components">
                        <select class="product-category">
                            <option>All</option>
                            <option>All Department</option>
                            <option>Arts & Crafts</option>
                            <option>Automotive</option>
                            <option>Baby</option>
                            <option>Beauty & Personal Care</option>
                            <option>Books</option>
                            <option>Boys' Fashion</option>
                            <option>Computers</option>
                            <option>Deals</option>
                            <option>Digital Musci</option>
                            <option>Girls' Fashion</option>
                            <option>Health & Household</option>
                            <option>Home & Kitchen</option>
                            <option>Industrial & Scientific</option>
                            <option>Kindle Store</option>
                            <option>Luggage</option>
                            <option>Men's Fashion</option>
                            <option>Movies & TV</option>
                            <option>Music, CDs & Vinyl</option>
                            <option>Pet Supplies</option>
                            <option>Prime Video</option>
                            <option>Software</option>
                            <option>Sports & Outdoors</option>
                            <option>Tools & Home Improvement</option>
                            <option>Toys & Games</option>
                            <option>Video Games</option>
                            <option>Women's Fashion</option>
                        </select>
                        
                        <!--Search bar-->
                        <input class="search-bar" type="text" placeholder="Search Amazon">
                        
                        <!--Search Icon-->
                        <div class="search-icon">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                    </div>
                </div>
                <!--Upper Navigation bar-->
                <div class="bottomnav">

                </div>
            </nav>
        </header>
    </body>
</html>
