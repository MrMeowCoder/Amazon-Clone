<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        <link rel="stylesheet" href="./log-style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
        <div class="log-outline">
            <div>
                <h1 id="login-great">WELCOME TO OUR SITE</h1>
                <H3 id="greet2">PLEASE ENTER YOUR DETAILS TO LOGIN</H3>
            </div>

            <!--Login-->
            <div class="log-bar">

                <div class="log-details">

                    <!--User name-->
                    <div class="user-id">
                        <div id="logo">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <span class="Enter-id">
                            <input type="text" id="uid" placeholder="Enter User name">
                        </span>
                </div>

                <!--Password-->
                <div class="user-password">
                    <div id="logo">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <span class="Enter-pass">
                        <input type="password" id="u-pass" placeholder="Enter user id">
                    </span>
                </div>
            </div>
                
                <div class="remember-row">

                    <!--Remember me-->
                    <span class="stay-in">
                        <label for="101">
                            <input id="101" type="checkbox"> Remember me
                        </label>
                    </span>
                    
                    <!--Forgor Password-->
                    <span class="forgot-pass">
                        <a class="links" href="#">Forgot Password?</a>
                    </span>
                </div>
                    
                <!--Regester-->
                <div class="regester">
                    <p>Don't have an Account? <b><a class="links" href="#">Regester Now</a></b></p>
                </div>
            </div>
        </div>
    </body>
</html>
